name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: for f in assets/js/*.js sw.js tests/smoke.js; do node --check "$f"; done
      - name: Standalone build is current
        run: python3 tools/build_standalone.py --check
      - name: Smoke tests
        run: npm test
